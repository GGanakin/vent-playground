      setTimeout(() => this.hit(0.022, 'bandpass', rnd(2600, 5600), 5, 0.042, clamp(pan + rnd(-0.2, 0.2), -1, 1)), i * rnd(22, 72));
    }
  },

  clang(pan, amt) {
    if (!this.ac) return;
    const ac = this.ac, t = ac.currentTime;
    for (const fr of [430, 612, 890, 1247]) {
      const o = ac.createOscillator(); o.type = 'triangle';
      o.frequency.setValueAtTime(fr * rnd(0.95, 1.05), t);
      const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = fr * 1.6; bp.Q.value = 3;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.045 * amt, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + rnd(0.45, 0.8));
      o.connect(bp); bp.connect(g); g.connect(this.out(pan));
      o.start(t); o.stop(t + 0.9);
    }
  },

  thump(pan, amt) {
    if (!this.ac) return;
    this.tone('sine', 74, 26, 0.42, 0.1 + 0.34 * amt, pan, 0.01);
    this.hit(0.14, 'bandpass', 420, 1.1, 0.18 * amt, pan, 180);
  },

  chargeStart() {
    if (!this.ac || this.chargeOsc) return;
    const ac = this.ac, t = ac.currentTime;
    const o = ac.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(58, t);
    o.frequency.linearRampToValueAtTime(196, t + CHARGE_T);
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 340; bp.Q.value = 2.2;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.055, t + CHARGE_T);
    o.connect(bp); bp.connect(g); g.connect(this.comp);
    o.start(t);
    this.chargeOsc = { o: o, g: g };
  },

  chargeEnd(launched) {
    if (!this.ac || !this.chargeOsc) return;
    const c = this.chargeOsc, t = this.ac.currentTime;
    this.chargeOsc = null;
    try {
      c.g.gain.cancelScheduledValues(t);
      c.g.gain.setValueAtTime(c.g.gain.value, t);
      c.g.gain.linearRampToValueAtTime(0.0001, t + (launched ? 0.05 : 0.22));
      c.o.stop(t + 0.32);
    } catch (err) { /* 已停止 */ }
  },

  snap() {
    if (!this.ac) return;
    this.hit(0.06, 'highpass', 4200, 0.9, 0.5, 0);
    this.tone('sine', 150, 30, 0.5, 0.6, -0.1, 0.006);
    const ac = this.ac, t = ac.currentTime;
    for (const fr of [1180, 1187, 1770]) {
      const o = ac.createOscillator(); o.type = 'square';
      o.frequency.setValueAtTime(fr, t);
      o.frequency.exponentialRampToValueAtTime(fr * 0.62, t + 1.5);
      const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = fr; bp.Q.value = 9;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.05, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
      o.connect(bp); bp.connect(g); g.connect(this.comp);
      o.start(t); o.stop(t + 1.7);
    }
    this.hit(1.2, 'lowpass', 300, 0.5, 0.16, 0, 90);
  },

  pad(on) {
    if (!this.ac) return;
    const ac = this.ac, t = ac.currentTime;
    if (!on || this.padNodes.length) return;
    for (const fr of [146.8, 220, 293.7]) {
      const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = fr;
      const g = ac.createGain(); g.gain.value = 0.0001;
      g.gain.linearRampToValueAtTime(0.018, t + 4);
      o.connect(g); g.connect(this.comp);
      o.start(t);
      this.padNodes.push({ o: o, g: g });
    }
  },

  relight() {
    if (!this.ac) return;
    this.hit(0.04, 'bandpass', 2600, 5, 0.12, 0.2);
    setTimeout(() => this.tone('sine', 523, 523, 0.9, 0.05, 0, 0.25), 90);
    if (this.hum) {
      const t = this.ac.currentTime;
      this.hum.gain.cancelScheduledValues(t);
      this.hum.gain.setValueAtTime(0.0001, t);
      this.hum.gain.linearRampToValueAtTime(0.05, t + 2.4);
    }
  },

  resetLoops() {
    this.chargeEnd(false);
    const t = this.ac ? this.ac.currentTime : 0;
    for (const p of this.padNodes) {
      try {
        p.g.gain.cancelScheduledValues(t);
        p.g.gain.setValueAtTime(p.g.gain.value, t);
        p.g.gain.linearRampToValueAtTime(0.0001, t + 0.6);
        p.o.stop(t + 0.7);
      } catch (err) { /* 已停止 */ }
    }
    this.padNodes = [];
    if (this.rain) this.rain.g.gain.setTargetAtTime(0.0001, t, 0.2);
  },

  chirp() {
    if (!this.ac) return;
    const ac = this.ac, t0 = ac.currentTime + rnd(0, 0.05);
    const o = ac.createOscillator(); o.type = 'sine';
    o.frequency.value = rnd(4100, 4650);
    const g = ac.createGain(); g.gain.value = 0.0001;
    const p = this.out(rnd(-0.6, 0.6));
    o.connect(g); g.connect(p);
    let t = t0;
    for (let i = 0; i < 5; i++) {
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.02, t + 0.008);
      g.gain.linearRampToValueAtTime(0.0001, t + 0.03);
      t += 0.052;
    }
    o.start(t0); o.stop(t + 0.05);
  },

  update(dt) {
    if (!this.ac) return;
    const ac = this.ac, t = ac.currentTime, heat = state.heat;
    if (this.wind) {
      this.wind.g.gain.setTargetAtTime(0.006 + heat * 0.05, t, 0.7);
      this.wind.f.frequency.setTargetAtTime(300 + heat * 520, t, 0.9);
    }
    if (this.hiss) this.hiss.g.gain.setTargetAtTime(0.0006 + heat * 0.014, t, 0.6);
    if (this.rain) this.rain.g.gain.setTargetAtTime(0.0001 + rainLevel * 0.075, t, 0.9);
    if (this.hum) this.hum.gain.setTargetAtTime(0.026 + heat * 0.03, t, 1.4);
    if (this.humOsc) this.humOsc[2].detune.setTargetAtTime(heat * 42, t, 1.2);
    if (!state.resetting && t > this.nextChirp) {
      if (rainLevel < 0.5 && heat < 0.95) this.chirp();
      this.nextChirp = t + rnd(2.6, 7.5);
    }
  },

  setMuted(m) {
    this.muted = m;
    if (!this.ac) return;
    const t = this.ac.currentTime;
    this.master.gain.cancelScheduledValues(t);
    this.master.gain.setTargetAtTime(m ? 0.0001 : 0.9, t, 0.18);
  }
};
</script>
<script>
/* ---------- 地上的东西：可破坏的小物件 ---------- */
const props = [];
const PROP_DEF = {
  bottle: { hw: 0.034, hh: 0.104, roll: true, hp: 3, mass: 0.75, mat: 'plastic' },
  can: { hw: 0.03, hh: 0.074, roll: true, hp: 2, mass: 0.6, mat: 'can' },
  ball: { hw: 0.062, hh: 0.062, roll: true, round: true, hp: 4, mass: 0.9, mat: 'rubber' },
  bin: { hw: 0.086, hh: 0.162, roll: false, hp: 4, mass: 2.6, mat: 'metal' },
  plank: { hw: 0.098, hh: 0.019, roll: false, hp: 3, mass: 1.8, mat: 'wood' }
};
const GLASS_COLS = ['rgba(226,240,255,.85)', 'rgba(180,206,238,.8)', 'rgba(255,236,206,.75)', 'rgba(150,176,214,.7)'];
const WOOD_COLS = ['rgba(120,86,58,.9)', 'rgba(74,52,38,.9)', 'rgba(176,142,104,.8)', 'rgba(40,30,24,.9)'];
const PLASTIC_COLS = ['rgba(196,226,214,.6)', 'rgba(120,164,150,.55)', 'rgba(236,248,244,.5)', 'rgba(70,110,102,.6)'];
const METAL_COLS = ['rgba(214,222,236,.85)', 'rgba(126,138,158,.8)', 'rgba(255,255,255,.6)', 'rgba(60,66,82,.85)'];

function mkProp(kind, x, y) {
  const d = PROP_DEF[kind];
  const u = S.u;
  return {
    kind: kind, def: d, x: x, y: y,
    hw: d.hw * u, hh: d.hh * u, rr: d.hw * u,
    rot: 0, vx: 0, vy: 0, vr: 0,
    hp: d.hp, loose: false, broken: false, thrown: false,
    dents: [], squash: 0, flash: 0, items: []
  };
}

function addProp(kind, xx) {
  const q = mkProp(kind, clamp(xx, W * 0.07, W * 0.93), S.propY - PROP_DEF[kind].hh * S.u);
  props.push(q);
  return q;
}

function buildProps() {
  props.length = 0;
  const u = S.u, p = S.portrait;
  const list = p
    ? [['bottle', 0.6], ['can', 0.665], ['ball', 0.735]]
    : [['bottle', 0.545], ['can', 0.585], ['bottle', 0.625], ['can', 0.66], ['ball', 0.7]];
  for (const it of list) {
    const q = addProp(it[0], W * it[1]);
    q.rot = it[0] === 'ball' ? 0 : rnd(-0.05, 0.05);
  }
  const bn = addProp('bin', p ? W * 0.31 : S.chairX - u * 1.2);
  bn.rot = 0;
}

function resetWorldExtras() {
  charge = 0; charging = false; chargeBoost = 0;
  kicks.length = 0; speedLines.length = 0;
  grab = null; held = null;
  lamp.glassHp = 3; lamp.glassGone = false; lamp.cracks.length = 0;
  for (const sw of swings) { sw.seat = true; sw.strap = 0; }
  buildProps();
}

/* ---------- 捡起 / 投掷 ---------- */
let grab = null, held = null;
const GRAB_DIST = 26, THROW_G = 1680;

function grabbable(p) { return p.kind === 'bottle' || p.kind === 'can' || p.kind === 'ball'; }

function handPt(x0) {
  const u = S.u;
  return { x: clamp(x0, u * 0.5, W - u * 0.5), y: S.propY - u * 0.44 };
}

function pickUp(p, x0) {
  const i = props.indexOf(p);
  if (i >= 0) props.splice(i, 1);
  p.loose = false; p.vx = 0; p.vy = 0; p.vr = 0; p.rot = 0; p.squash = 0; p.thrown = false;
  held = { p: p, hx: handPt(x0).x, t: 0 };
  state.started = true;
  state.lastInteract = state.time;
  AU.hitMat(p.def.mat, 0.16, clamp((p.x - W / 2) / (W / 2), -1, 1), false);
}

function dropHeld() {
  if (!held) return;
  const p = held.p;
  p.x = clamp(held.hx, W * 0.07, W * 0.93);
  p.y = S.propY - propHalfH(p);
  p.loose = false;
  props.push(p);
  held = null;
}

function throwPath(p0, aim) {
  const d = Math.hypot(aim.x - p0.x, aim.y - p0.y);
  const T = clamp(0.36 + d / 2400, 0.36, 0.82);
  return {
    T: T,
    vx: (aim.x - p0.x) / T,
    vy: (aim.y - p0.y) / T - 0.5 * THROW_G * T
  };
}

function throwHeld(ax, ay) {
  if (!held) return;
  const p = held.p;
  const p0 = handPt(held.hx);
  let aim = { x: clamp(ax, -W * 0.1, W * 1.1), y: clamp(ay, -W * 0.1, H * 1.05) };
  const bn = props.find(q => q.kind === 'bin' && !q.broken);
  if (bn) {
    const rimY = bn.y - bn.hh * 0.86;
    if (aim.y > rimY - bn.hh * 0.1 && aim.y < bn.y + bn.hh && Math.abs(aim.x - bn.x) < bn.hw * 1.7) {
      aim = { x: bn.x, y: rimY + bn.hh * 0.01 };
    }
  }
  const v = throwPath(p0, aim);
  p.x = p0.x; p.y = p0.y;
  p.vx = v.vx; p.vy = v.vy;
  p.vr = (v.vx >= 0 ? 1 : -1) * rnd(4, 9);
  p.loose = true; p.thrown = true;
  props.push(p);
  held = null;
  growl(p0.x);
  spawnDust(p0.x + v.vx * 0.03, S.propY - S.u * 0.01, 0.35, 0.5);
  state.started = true;
  state.lastInteract = state.time;
}

function growl(x) {
  AU.hitMat('whiff', 0.85, clamp((x - W / 2) / (W / 2), -1, 1), false);
}

function intoBin(p, bn) {
  bn.items.push({ kind: p.kind, x: rnd(-0.55, 0.55), y: rnd(0, 0.1), tilt: rnd(-0.5, 0.5) });
  if (bn.items.length > 6) bn.items.shift();
  bn.squash = Math.min(0.55, bn.squash + 0.26);
  cam.trauma = Math.min(1.1, cam.trauma + 0.045);
  AU.hitMat('metal', 0.55, clamp((bn.x - W / 2) / (W / 2), -1, 1), false);
  spawnDust(bn.x, bn.y - bn.hh * 0.8, 0.22, 0.4);
  state.started = true;
  state.lastInteract = state.time;
  if (!said.binIn) { said.binIn = true; say('……进了。', 2.6); }
  if (bn.items.length >= 5 && !said.binFull) { said.binFull = true; say('满了。', 2.8); }
}

function spillBin(bn) {
  const n = bn.items.length;
  if (!n) return;
  for (let i = 0; i < n; i++) {
    const it = bn.items[i];
    const q = spawnProp(it.kind, bn.x + it.x * bn.hw, bn.y - bn.hh * 0.7);
    const dir = it.x >= 0 ? 1 : -1;
    q.loose = true;
    q.rot = rnd(-1.2, 1.2);
    q.vx = dir * S.u * rnd(0.5, 1.4);
    q.vy = -S.u * rnd(0.25, 0.8);
    q.vr = dir * rnd(2, 7);
  }
  bn.items.length = 0;
  if (!said.spill) { said.spill = true; say('撒了一地。', 3); }
}

function propHalfH(p) {
  if (p.def.round) return p.rr;
  return Math.abs(Math.cos(p.rot)) * p.hh + Math.abs(Math.sin(p.rot)) * p.hw;
}

function propHit(wx, wy) {
  const u = S.u;
  let best = null, bestD = 1e9;
  for (const p of props) {
    if (p.x < -u * 0.3 || p.x > W + u * 0.3) continue;
    const hh = propHalfH(p), hw = p.def.round ? p.rr : (Math.abs(Math.cos(p.rot)) * p.hw + Math.abs(Math.sin(p.rot)) * p.hh);
    const pad = u * 0.03;
    if (Math.abs(wx - p.x) > hw + pad) continue;
    if (wy > p.y + hh + pad || wy < p.y - hh - pad) continue;
    const d = Math.abs(wx - p.x) + Math.abs(wy - p.y);
    if (d < bestD) { bestD = d; best = p; }
  }
  if (!best) return null;
  return { kind: 'prop', p: best, pt: { x: best.x, y: clamp(wy, best.y - propHalfH(best), best.y + propHalfH(best)) } };
}

/* ---------- 打击反馈（脚影 / 速度线 / 顿帧 / 冲量） ---------- */
function applyHit(x, y, side, force, o) {
  o = o || {};
  const u = S.u;
  const heavy = !!o.heavy;
  const boost = heavy ? 1.55 : 1;
  cam.trauma = Math.min(1.15, cam.trauma + (0.07 + force * 0.085) * boost);
  cam.punch = Math.min(1.1, cam.punch + (0.26 + force * 0.4) * (heavy ? 1.8 : 1));
  state.hitstop = Math.max(state.hitstop, (0.022 + force * 0.02) * (heavy ? 2.2 : 1));
  if (heavy) state.slow = Math.min(state.slow, 0.32);
  else if (force > 1.02) state.slow = Math.min(state.slow, 0.6);
  state.flash = Math.min(0.92, state.flash + force * (heavy ? 0.24 : 0.12));
  addImpact(x, y, force * (heavy ? 1.5 : 1));
  if (!o.noFoot) {
    const dir = -side;
    addKick(x, y, dir, force, heavy);
    addSpeedLines(x, y, dir, force, heavy);
  }
  if (o.ring) addRing(o.ring[0], o.ring[1], o.ring[2] == null ? force : o.ring[2]);
  if (o.dust) spawnDust(o.dust[0], o.dust[1], o.dust[2] == null ? force : o.dust[2], 0.9);
  const pan = clamp((x - W / 2) / (W / 2), -1, 1);
  if (o.mat) AU.hitMat(o.mat, clamp(force, 0.25, 1.4), pan, heavy);
  if (navigator.vibrate) navigator.vibrate(Math.round((10 + force * 18) * (heavy ? 1.9 : 1)));
  return pan;
}

function addKick(x, y, side, force, heavy) {
  const u = S.u;
  const wind = heavy ? 0.09 : 0.055;
  kicks.push({
    x: x, y: y, side: side, heavy: heavy, t: -wind, wind: wind,
    hold: heavy ? 0.13 : 0.055, ret: heavy ? 0.34 : 0.19,
    reach: u * (heavy ? 1.15 : 0.8) * (0.8 + clamp(force, 0.3, 1.5) * 0.35),
    s: u * (heavy ? 0.25 : 0.2),
    tilt: heavy ? -0.34 : -0.14
  });
  if (kicks.length > 4) kicks.shift();
}

function addSpeedLines(x, y, side, force, heavy) {
  const u = S.u;
  const fc = clamp(force, 0.3, 1.5);
  const n = heavy ? 13 : 5 + (fc * 5 | 0);
  const base = Math.atan2(-0.3, side);
  const lines = [];
  for (let i = 0; i < n; i++) {
    const sp = (Math.random() * 2 - 1) * (heavy ? 1.15 : 0.8);
    lines.push([base + sp, u * rnd(0.1, 0.3) * (heavy ? 1.5 : 1), u * rnd(0.42, 1.5) * (0.55 + fc * 0.5) * (heavy ? 1.4 : 1)]);
  }
  speedLines.push({
    x: x, y: y, life: heavy ? 0.3 : 0.17, max: heavy ? 0.3 : 0.17,
    lines: lines, heavy: heavy, w: u * (heavy ? 0.011 : 0.006)
  });
  if (speedLines.length > 5) speedLines.shift();
}

function updateKicks(dt) {
  for (let i = kicks.length - 1; i >= 0; i--) {
    const k = kicks[i];
    k.t += dt;
    if (k.t > k.hold + k.ret + 0.1) kicks.splice(i, 1);
  }
  for (let i = speedLines.length - 1; i >= 0; i--) {
    speedLines[i].life -= dt;
    if (speedLines[i].life <= 0) speedLines.splice(i, 1);
  }
}

function kickState(k) {
  if (k.t < 0) {
    const p = clamp(1 + k.t / k.wind, 0, 1);
    return { off: k.reach * Math.pow(1 - p, 1.6), a: 0.35 + 0.65 * p, up: -k.reach * 0.3 * Math.pow(1 - p, 1.2) };
  }
  if (k.t < k.hold) return { off: 0, a: 1, up: 0 };
  const r = clamp((k.t - k.hold) / k.ret, 0, 1);
  return { off: k.reach * 1.25 * (r * r), a: 1 - r, up: -k.reach * 0.42 * r };
}
/* ---------- 物件物理 ---------- */
function updateProps(dt) {
  const u = S.u;
  if (held) held.t += dt;
  const bin = props.find(q => q.kind === 'bin' && !q.broken) || null;
  const head = lampHead();
  let dropped = false;
  for (const p of props) {
    if (p.flash > 0) p.flash = Math.max(0, p.flash - dt * 3.4);
    if (p.squash > 0) p.squash = Math.max(0, p.squash - dt * 4.2);
    if (!p.loose) continue;
    const px0 = p.x, py0 = p.y;
    p.vy += 1680 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.rot += p.vr * dt;
    const hh = propHalfH(p);
    if (p.thrown) {
      if (!lamp.glassGone && Math.hypot(p.x - head.x, p.y - head.y) < S.globeR * 1.15) {
        hitLampByThrow({ x: p.x, y: p.y }, p);
        p.gone = true; dropped = true; continue;
      }
      if (bin && p.vy > 0) {
        const rimY = bin.y - bin.hh * 0.86;
        if (py0 < rimY + bin.hh * 0.09 && p.y >= rimY && Math.abs(p.x - bin.x) < bin.hw * 1.02) {
          intoBin(p, bin);
          p.gone = true; dropped = true; continue;
        }
      }
    }
    if (bin) {
      const top = bin.y - bin.hh * 0.84, bot = bin.y + bin.hh * 0.98;
      const br = (p.def.round ? p.rr : Math.min(p.hw, p.hh)) * 0.8;
      if (p.y > top && p.y < bot && Math.abs(px0 - bin.x) > bin.hw) {
        const side = px0 >= bin.x ? 1 : -1;
        if (Math.abs(p.x - bin.x) < bin.hw + br) {
          p.x = bin.x + side * (bin.hw + br);
          p.vx = side * Math.abs(p.vx) * 0.42;
          p.vr *= -0.5;
          AU.hitMat('metal', clamp(Math.abs(p.vx) / 900, 0.15, 0.7), clamp((p.x - W / 2) / (W / 2), -1, 1), false);
        }
      }
    }
    const wall = u * 0.05;
    if (p.x < wall) { p.x = wall; p.vx = Math.abs(p.vx) * 0.45; AU.hitMat(p.def.mat, 0.3, -0.9, false); }
    if (p.x > W - wall) { p.x = W - wall; p.vx = -Math.abs(p.vx) * 0.45; AU.hitMat(p.def.mat, 0.3, 0.9, false); }
    if (p.y >= S.propY - hh) {
      p.y = S.propY - hh;
      const hard = clamp(Math.abs(p.vy) / 700, 0, 1);
      if (Math.abs(p.vy) > 55) {
        const rest = p.kind === 'ball' ? (p.broken ? 0.3 : 0.76) : (p.def.roll ? 0.3 : 0.16);
        p.vy = -Math.abs(p.vy) * rest;
        p.vx *= 0.74;
        p.vr *= 0.5;
        p.squash = Math.min(0.55, hard * (p.kind === 'ball' ? 0.6 : 0.3));
        if (hard > 0.12) {
          spawnDust(p.x, S.propY, hard * 0.55, 0.6);
          AU.hitMat(p.kind === 'ball' ? 'bounce' : 'thud', hard, clamp((p.x - W / 2) / (W / 2), -1, 1), false);
        }
      } else {
        p.vy = 0;
        const drag = p.kind === 'ball' ? 1.3 : (p.def.roll ? 2.4 : 4.4);
        p.vx *= 1 - Math.min(1, dt * drag);
        p.vr *= 1 - Math.min(1, dt * 5);
        if (p.def.roll) p.vr = p.vx / ((p.def.round ? p.rr : p.hh) * 2.2);
        if (Math.abs(p.vx) < 9 && Math.abs(p.vr) < 0.6) {
          p.vx = 0; p.vy = 0; p.vr = 0; p.loose = false; p.thrown = false;
          if (!p.def.round) p.rot = Math.round(p.rot / (PI / 2)) * (PI / 2);
          p.y = S.propY - propHalfH(p);
        }
      }
    }
  }
  if (dropped) {
    for (let i = props.length - 1; i >= 0; i--) if (props[i].gone) props.splice(i, 1);
  }
  if (freeChair) collideChairProps();
}

function collideChairProps() {
  const u = S.u, f = freeChair;
  if (!f) return;
  const speed = Math.abs(f.vx) + Math.abs(f.vy);
  if (speed < u * 0.35) return;
  for (const p of props) {
    const dx = p.x - f.x;
    if (Math.abs(dx) > u * 0.4) continue;
    if (p.y - propHalfH(p) > S.propY - u * 0.7) continue;
    const side = dx >= 0 ? 1 : -1;
    const force = clamp(speed / (u * 2.2), 0.3, 1.2);
    p.loose = true;
    p.vx = side * u * (0.7 + force * 1.3);
    p.vy = -u * rnd(0.35, 0.95) * force;
    p.vr = -side * rnd(3, 8);
    p.flash = 0.5;
    spawnDust(p.x, S.propY, force * 0.6, 0.7);
    AU.hitMat(p.def.mat, force * 0.7, clamp((p.x - W / 2) / (W / 2), -1, 1), false);
  }
}

function blastProps(x, y, force) {
  const u = S.u;
  for (const p of props) {
    const dx = p.x - x;
    const d = Math.abs(dx) / (u * 3);
    if (d > 1) continue;
    const side = dx >= 0 ? 1 : -1;
    const f = force * (1 - d * 0.6);
    p.loose = true;
    p.vx = side * u * (0.5 + f * 1.6);
    p.vy = -u * rnd(0.4, 1.3) * f;
    p.vr = -side * rnd(2, 9);
    p.flash = 0.6;
  }
}

/* ---------- 物件画法 ---------- */
function propRim(p) {
  const head = lampHead();
  return clamp(0.22 + (1 - clamp(Math.abs(p.x - head.x) / (W * 0.6), 0, 1)) * 0.55, 0, 0.8);
}

function drawProps() {
  const u = S.u;
  for (const p of props) {
    if (p.x < -u * 0.4 || p.x > W + u * 0.4) continue;
    const hh = propHalfH(p);
    const lift = clamp((S.propY - hh - p.y) / (u * 0.5), 0, 1);
    radialEllipse(ctx, p.x, S.propY + u * 0.012, p.hw * (1.7 - lift * 0.5), u * 0.026 * (1 - lift * 0.35),
      [[0, 'rgba(4,3,9,' + (0.42 - lift * 0.2).toFixed(3) + ')'], [1, 'rgba(4,3,9,0)']], 'multiply');
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    if (p.squash > 0.01) {
      const sq = p.squash * 0.4;
      ctx.scale(1 + sq, 1 - sq);
    }
    if (p.kind === 'bottle') drawBottle(p);
    else if (p.kind === 'can') drawCan(p);
    else if (p.kind === 'ball') drawBall(p);
    else if (p.kind === 'bin') drawBin(p);
    else if (p.kind === 'plank') drawPlank(p);
    if (p.flash > 0.01) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = p.flash * 0.5;
      ctx.fillStyle = 'rgba(255,224,180,1)';
      ctx.fillRect(-p.hw, -p.hh, p.hw * 2, p.hh * 2);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }
}

function shade(g, x0, y0, x1, y1, rim) {
  const lg = g.createLinearGradient(x0, y0, x1, y1);
  lg.addColorStop(0, 'rgba(255,196,138,' + (0.30 * rim).toFixed(3) + ')');
  lg.addColorStop(0.45, 'rgba(60,52,64,.2)');
  lg.addColorStop(1, 'rgba(6,5,12,.85)');
  return lg;
}

function drawBottle(p) {
  const g = ctx, w = p.hw, h = p.hh;
  const rim = propRim(p);
  const cr = p.broken ? 0.62 : 1;
  g.save();
  g.scale(1 / (p.broken ? 1.35 : 1), cr);
  const hy = h / cr;
  g.fillStyle = 'rgba(28,44,40,.9)';
  g.beginPath();
  g.moveTo(-w, hy * 0.72);
  g.quadraticCurveTo(-w * 1.12, hy * 0.1, -w * 0.42, -hy * 0.44);
  g.lineTo(-w * 0.34, -hy * 0.78);
  g.lineTo(w * 0.34, -hy * 0.78);
  g.lineTo(w * 0.42, -hy * 0.44);
  g.quadraticCurveTo(w * 1.12, hy * 0.1, w, hy * 0.72);
  g.quadraticCurveTo(0, hy * 1.06, -w, hy * 0.72);
  g.closePath();
  g.fill();
  g.fillStyle = shade(g, -w, 0, w, 0, rim);
  g.fill();
  g.fillStyle = 'rgba(196,206,196,.5)';
  g.beginPath();
  rr(g, -w * 0.9, -hy * 0.12, w * 1.8, hy * 0.3, w * 0.12);
  g.fill();
  g.fillStyle = 'rgba(228,232,240,.75)';
  g.beginPath();
  rr(g, -w * 0.36, -hy * 0.98, w * 0.72, hy * 0.22, w * 0.08);
  g.fill();
  g.strokeStyle = 'rgba(255,214,170,' + (0.2 + rim * 0.3).toFixed(3) + ')';
  g.lineWidth = 1;
  g.beginPath();
  g.moveTo(-w * 0.62, hy * 0.6);
  g.quadraticCurveTo(-w * 0.72, 0, -w * 0.28, -hy * 0.42);
  g.stroke();
  g.restore();
  drawDents(p, w, h);
  if (p.broken) {
    g.strokeStyle = 'rgba(236,246,240,.4)';
    g.lineWidth = 0.9;
    for (let i = 0; i < 3; i++) {
      const yy = -h * 0.5 + i * h * 0.45;
      g.beginPath();
      g.moveTo(-w * 0.85, yy);
      g.lineTo(-w * 0.2, yy + w * 0.3);
      g.lineTo(w * 0.55, yy - w * 0.2);
      g.stroke();
    }
  }
}

function drawCan(p) {
  const g = ctx, w = p.hw, h = p.hh;
  const rim = propRim(p);
  g.save();
  if (p.broken) g.scale(1.5, 0.45);
  const hy = h / (p.broken ? 0.45 : 1);
  g.fillStyle = 'rgba(74,44,52,.92)';
  g.beginPath();
  rr(g, -w, -hy, w * 2, hy * 2, w * 0.28);
  g.fill();
  g.fillStyle = shade(g, -w, 0, w, 0, rim);
  g.beginPath();
  rr(g, -w, -hy, w * 2, hy * 2, w * 0.28);
  g.fill();
  g.fillStyle = 'rgba(206,196,206,.42)';
  g.beginPath();
  rr(g, -w * 0.96, -hy * 0.18, w * 1.92, hy * 0.34, w * 0.1);
  g.fill();
  g.fillStyle = 'rgba(232,238,248,.8)';
  g.beginPath();
  g.ellipse(0, -hy, w * 0.86, w * 0.3, 0, 0, TAU);
  g.fill();
  g.strokeStyle = 'rgba(30,26,34,.8)';
  g.lineWidth = 1;
  g.beginPath();
  g.ellipse(w * 0.1, -hy - w * 0.02, w * 0.22, w * 0.1, 0, 0, TAU);
  g.stroke();
  g.restore();
  drawDents(p, w, h);
}

function drawBall(p) {
  const g = ctx, r = p.rr, rim = propRim(p);
  const sq = p.squash * 0.25;
  g.save();
  g.scale(1 + sq, 1 - sq);
  g.fillStyle = 'rgba(92,36,44,.95)';
  g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill();
  const rg = g.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r);
  rg.addColorStop(0, 'rgba(255,186,140,' + (0.4 * rim + 0.12).toFixed(3) + ')');
  rg.addColorStop(0.55, 'rgba(120,52,62,.25)');
  rg.addColorStop(1, 'rgba(8,6,12,.8)');
  g.fillStyle = rg;
  g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill();
  g.save();
  g.beginPath(); g.arc(0, 0, r, 0, TAU); g.clip();
  g.strokeStyle = 'rgba(240,228,214,.34)';
  g.lineWidth = r * 0.16;
  g.beginPath(); g.arc(-r * 1.5, 0, r * 1.55, -0.9, 0.9); g.stroke();
  g.beginPath(); g.arc(r * 1.5, 0, r * 1.55, PI - 0.9, PI + 0.9); g.stroke();
  g.restore();
  if (p.broken) {
    g.fillStyle = 'rgba(10,8,14,.92)';
    g.beginPath(); g.arc(r * 0.42, r * 0.18, r * 0.24, 0, TAU); g.fill();
    g.strokeStyle = 'rgba(255,200,160,.2)';
    g.lineWidth = 1;
    g.beginPath(); g.arc(r * 0.42, r * 0.18, r * 0.24, 0, TAU); g.stroke();
    g.beginPath();
    g.ellipse(0, r * 0.1, r * 0.92, r * 0.78, 0, 0.2, PI - 0.2);
    g.stroke();
  }
  for (const d of p.dents) {
    g.strokeStyle = 'rgba(255,226,196,.16)';
    g.lineWidth = 1;
    g.beginPath(); g.arc(Math.cos(d.a) * r * 0.5, Math.sin(d.a) * r * 0.5, r * d.s * 0.5, 0, TAU); g.stroke();
  }
  g.restore();
}

function drawBin(p) {
  const g = ctx, w = p.hw, h = p.hh, rim = propRim(p);
  const body = () => {
    g.beginPath();
    g.moveTo(-w, -h * 0.86);
    g.lineTo(w, -h * 0.86);
    g.lineTo(w * 0.78, h);
    g.quadraticCurveTo(0, h * 1.12, -w * 0.78, h);
    g.closePath();
  };
  g.fillStyle = 'rgba(44,42,54,.95)';
  body(); g.fill();
  g.fillStyle = shade(g, -w, 0, w, 0, rim);
  body(); g.fill();
  g.strokeStyle = 'rgba(226,232,246,.07)';
  g.lineWidth = 1;
  for (let i = 1; i < 3; i++) {
    const yy = -h * 0.86 + i * h * 0.6;
    const ww = lerp(w, w * 0.78, i / 3);
    g.beginPath(); g.moveTo(-ww, yy); g.lineTo(ww, yy); g.stroke();
  }
  g.strokeStyle = 'rgba(255,206,160,' + (0.1 + rim * 0.16).toFixed(3) + ')';
  g.lineWidth = 1.2;
  g.beginPath(); g.moveTo(-w * 0.96, -h * 0.8); g.lineTo(-w * 0.76, h * 0.8); g.stroke();
  g.fillStyle = 'rgba(6,5,10,.95)';
  g.beginPath();
  g.ellipse(0, -h * 0.86, w * 0.94, w * 0.26, 0, 0, TAU);
  g.fill();
  for (const it of p.items) drawBinItem(it, w, h);
  g.strokeStyle = 'rgba(226,232,246,.17)';
  g.lineWidth = 1;
  g.beginPath();
  g.ellipse(0, -h * 0.87, w * 0.94, w * 0.26, 0, 0.12, PI - 0.12);
  g.stroke();
  for (const d of p.dents) {
    g.fillStyle = 'rgba(10,9,16,' + (0.25 + d.s * 0.3).toFixed(3) + ')';
    g.beginPath();
    g.ellipse(d.x * w, d.y * h, w * d.s * 0.5, h * d.s * 0.32, d.a, 0, TAU);
    g.fill();
    g.strokeStyle = 'rgba(226,236,250,.16)';
    g.lineWidth = 0.8;
    g.stroke();
  }
}

function drawHeld() {
  if (!held) return;
  const u = S.u, p = held.p;
  const p0 = handPt(held.hx);
  if (mouse.x > -1e3) {
    const aim = screenToWorld(mouse.x, mouse.y);
    const v = throwPath(p0, aim);
    const at = k => {
      const tt = v.T * (0.05 + 0.9 * k);
      return { x: p0.x + v.vx * tt, y: p0.y + v.vy * tt + 0.5 * THROW_G * tt * tt };
    };
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(255,226,186,.10)';
    ctx.lineWidth = Math.max(1, u * 0.007);
    ctx.beginPath();
    for (let i = 0; i <= 18; i++) {
      const q = at(i / 18);
      if (i) ctx.lineTo(q.x, q.y); else ctx.moveTo(q.x, q.y);
    }
    ctx.stroke();
    for (let i = 1; i <= 6; i++) {
      const q = at(i / 6), k = i / 6;
      ctx.fillStyle = 'rgba(255,234,200,' + (0.34 * (1 - k * 0.45)).toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(q.x, q.y, Math.max(1.1, u * 0.011 * (1 - k * 0.25)), 0, TAU);
      ctx.fill();
    }
    const end = at(1);
    ctx.strokeStyle = 'rgba(255,226,186,.17)';
    ctx.lineWidth = Math.max(1, u * 0.006);
    ctx.beginPath(); ctx.arc(end.x, end.y, u * 0.016, 0, TAU); ctx.stroke();
    ctx.restore();
  }
  const bob = Math.sin(held.t * 8) * u * 0.006;
  ctx.save();
  ctx.translate(p0.x, p0.y + bob - p.hh * 0.12);
  ctx.rotate(-0.2 + Math.sin(held.t * 3.4) * 0.06);
  ctx.scale(1.16, 1.16);
  if (p.kind === 'bottle') drawBottle(p);
  else if (p.kind === 'can') drawCan(p);
  else drawBall(p);
  ctx.restore();
}

function drawBinItem(it, w, h) {
  const g = ctx;
  g.save();
  g.translate(it.x * w * 0.86, -h * 0.86 + it.y * h - w * 0.02);
  g.rotate(it.tilt);
  g.scale(1.35, 1.35);
  if (it.kind === 'ball') {
    g.fillStyle = 'rgba(104,40,48,.95)';
    g.beginPath(); g.arc(0, -w * 0.14, w * 0.24, 0, TAU); g.fill();
    g.strokeStyle = 'rgba(255,206,168,.16)';
    g.lineWidth = 1;
    g.beginPath(); g.arc(0, -w * 0.14, w * 0.24, PI * 1.05, PI * 1.95); g.stroke();
  } else if (it.kind === 'can') {
    g.fillStyle = 'rgba(84,52,60,.96)';
    g.beginPath(); rr(g, -w * 0.17, -w * 0.44, w * 0.34, w * 0.44, w * 0.07); g.fill();
    g.fillStyle = 'rgba(212,220,232,.45)';
    g.beginPath(); g.ellipse(0, -w * 0.44, w * 0.17, w * 0.05, 0, 0, TAU); g.fill();
  } else {
    g.fillStyle = 'rgba(38,66,56,.96)';
    g.beginPath(); rr(g, -w * 0.13, -w * 0.52, w * 0.26, w * 0.52, w * 0.08); g.fill();
    g.fillStyle = 'rgba(224,232,240,.5)';
    g.beginPath(); rr(g, -w * 0.1, -w * 0.64, w * 0.2, w * 0.15, w * 0.03); g.fill();
  }
  g.restore();
}

function drawPlank(p) {
  const g = ctx, w = p.hw, h = p.hh, rim = propRim(p);
  g.fillStyle = 'rgba(74,52,38,.95)';
  g.beginPath();
  rr(g, -w, -h, w * 2, h * 2, h * 0.6);
  g.fill();
  g.fillStyle = shade(g, -w, 0, w, 0, rim);
  g.beginPath();
  rr(g, -w, -h, w * 2, h * 2, h * 0.6);
  g.fill();
  g.strokeStyle = 'rgba(210,180,140,.16)';
  g.lineWidth = 0.8;
  for (let i = 0; i < 3; i++) {
    const yy = -h * 0.5 + i * h * 0.5;
    g.beginPath(); g.moveTo(-w * 0.85, yy); g.lineTo(w * 0.85, yy + h * 0.2); g.stroke();
  }
  g.fillStyle = 'rgba(18,16,24,.9)';
  for (const s of [-1, 1]) {
    g.beginPath(); g.arc(s * w * 0.7, 0, h * 0.4, 0, TAU); g.fill();
  }
  if (p.broken) {
    g.strokeStyle = 'rgba(240,214,178,.4)';
    g.lineWidth = 1.1;
    g.beginPath();
    g.moveTo(-w * 0.2, -h); g.lineTo(-w * 0.05, 0); g.lineTo(w * 0.18, -h * 0.6); g.lineTo(w * 0.3, h);
    g.stroke();
  }
}

function drawDents(p, w, h) {
  const g = ctx;
  for (const d of p.dents) {
    g.strokeStyle = 'rgba(255,232,206,.22)';
    g.lineWidth = 0.9;
    g.beginPath();
    g.ellipse(d.x * w, d.y * h, w * d.s * 0.6, h * d.s * 0.34, d.a, 0, TAU);
    g.stroke();
    g.fillStyle = 'rgba(8,7,13,.35)';
    g.fill();
  }
}
/* ---------- 物件受击 ---------- */
function spawnProp(kind, x, y) {
  const q = mkProp(kind, x, y);
  props.push(q);
  if (props.length > 12) props.shift();
  return q;
}

function hitProp(p, wx, wy) {
  const u = S.u;
  const boost = chargeBoost;
  const heavy = boost > 0.3;
  const side = wx >= p.x ? 1 : -1;
  const force = clamp(0.6 + boost * 0.95, 0.4, 1.65) / (0.55 + p.def.mass * 0.45);
  const hh = propHalfH(p);
  const impactY = clamp(wy, p.y - hh, p.y + hh * 0.3);
  const dying = p.hp <= 1 + (heavy ? 1 : 0) && !p.broken;

  p.loose = true;
  p.vx = -side * u * (0.55 + force * 0.85) * (p.kind === 'bin' ? 0.5 : 1);
  p.vy = -u * (0.3 + force * 0.62) * (p.kind === 'bin' ? 0.34 : 1);
  p.vr = -side * rnd(2.5, 7) * (p.def.roll ? 0.8 : 1.6) * (heavy ? 1.5 : 1);
  if (p.kind === 'bin') p.rot += -side * (0.18 + force * 0.16);
  p.hp -= 1 + (heavy ? 1.3 : 0);
  p.flash = 0.9;
  p.dents.push({
    x: rnd(-0.6, 0.6), y: rnd(-0.7, 0.4), a: rnd(TAU),
    s: 0.28 + force * 0.3 + (p.broken ? 0.1 : 0)
  });
  if (p.dents.length > 6) p.dents.shift();

  applyHit(p.x, impactY, side, force * (heavy ? 1.2 : 1), {
    heavy: heavy, mat: dying ? 'burst' : p.def.mat,
    dust: [p.x + side * u * 0.04, S.propY - u * 0.01, force * 0.9]
  });
  if (p.def.roll) spawnLeafBurst(p.x, impactY, 1);
  state.heat = Math.min(1.15, state.heat + 0.05 * force + boost * 0.07);
  cat.alert = Math.max(cat.alert, 0.7);
  for (const sw of swings) sw.v += -side * rnd(0.05, 0.22) * force * 0.5;

  if (!said.props) { said.props = true; say('谁让它们在这儿。', 3.2); }
  if (p.hp <= 0) breakProp(p, side, force);
}

function breakProp(p, side, force) {
  if (p.broken) return;
  p.broken = true;
  p.hp = 0;
  p.flash = 1;
  const u = S.u;
  if (p.kind === 'bottle') {
    spawnChips(p.x, p.y, 7, 0.7 + force * 0.5, PLASTIC_COLS, 0.008, 0.02);
    spawnChips(p.x, p.y - p.hh, 1, 0.5, ['rgba(232,238,246,.9)'], 0.01, 0.014);
    p.vx *= 1.3;
  } else if (p.kind === 'can') {
    spawnChips(p.x, p.y, 6, 0.6 + force * 0.5, METAL_COLS, 0.007, 0.016);
    spawnDust(p.x, p.y - p.hh * 0.4, force * 0.9, 0.7);
    p.vx *= 1.35;
  } else if (p.kind === 'ball') {
    spawnDust(p.x, p.y, force * 0.5, 0.5);
    p.vy = -Math.abs(p.vy) * 0.3;
    AU.hitMat('deflate', force, clamp((p.x - W / 2) / (W / 2), -1, 1), false);
  } else if (p.kind === 'bin') {
    spillBin(p);
    spawnChips(p.x, p.y - p.hh, 9, 0.55 + force * 0.35,
      ['rgba(222,226,236,.7)', 'rgba(176,158,138,.7)', 'rgba(120,132,150,.65)', 'rgba(88,80,96,.7)'], 0.012, 0.03);
    spawnDust(p.x, S.propY, force, 0.8);
    addRing(p.x, S.propY, force * 0.6);
    p.vx *= 0.7;
  } else if (p.kind === 'plank') {
    spawnChips(p.x, p.y, 8, 0.6 + force * 0.5, WOOD_COLS, 0.009, 0.024);
  }
  cam.trauma = Math.min(1.2, cam.trauma + 0.2);
  cam.punch = Math.min(1.1, cam.punch + 0.4);
  state.flash = Math.min(0.95, state.flash + 0.22);
  state.heat = Math.min(1.15, state.heat + 0.08);
  if (!said.propsBroke) { said.propsBroke = true; say('一个也不剩。', 3.2); }
}

function addGlassCracks(hitPt, hp) {
  const r = S.globeR;
  const a0 = Math.atan2(hitPt.y - lampHead().y, hitPt.x - lampHead().x);
  const n = hp > 1 ? 3 : 5;
  for (let i = 0; i < n; i++) {
    const a = a0 + rnd(-1.1, 1.1);
    const pts = [[Math.cos(a) * r * 0.15, Math.sin(a) * r * 0.15]];
    let px = pts[0][0], py = pts[0][1];
    const segs = 2 + (Math.random() * 2 | 0);
    for (let k = 0; k < segs; k++) {
      const na = a + rnd(-0.5, 0.5);
      const st = r * rnd(0.22, 0.4);
      px += Math.cos(na) * st; py += Math.sin(na) * st;
      const dd = Math.hypot(px, py);
      if (dd > r * 0.96) { px = px / dd * r * 0.96; py = py / dd * r * 0.96; }
      pts.push([px, py]);
    }
    lamp.cracks.push(pts);
  }
  if (lamp.cracks.length > 16) lamp.cracks.splice(0, lamp.cracks.length - 16);
}

function shatterLamp(pt, side) {
  const head = lampHead();
  lamp.glassGone = true;
  lamp.glassHp = 0;
  lamp.dim = Math.min(lamp.dim, 0.58);
  lamp.flick = 0;
  lamp.cracks.length = 0;
  state.flash = 0.9;
  state.hitstop = Math.max(state.hitstop, 0.12);
  state.slow = Math.min(state.slow, 0.28);
  cam.trauma = Math.min(1.2, cam.trauma + 0.55);
  cam.punch = Math.min(1.2, cam.punch + 0.75);
  state.heat = Math.min(1.15, state.heat + 0.18);
  spawnChips(head.x, head.y, 20, 1.15, GLASS_COLS, 0.008, 0.028);
  spawnDust(head.x, head.y, 0.7, 0.7);
  addRing(S.lampX, S.groundY, 0.75);
  addImpact(head.x, head.y, 1.3);
  for (const m of moths) m.scare = 1.4;
  for (const sw of swings) sw.v += rnd(-0.5, 0.5);
  cat.alert = 1;
  AU.hitMat('shatter', 1, clamp((head.x - W / 2) / (W / 2), -1, 1), true);
  if (!said.lampOut) { said.lampOut = true; say('暗一点也行。', 3.8); }
}

function tearSeat(i, pt, side, force) {
  const sw = swings[i];
  const u = S.u;
  sw.seat = false;
  sw.strap = 1;
  sw.v += -side * 0.6;
  const q = spawnProp('plank', pt.x, pt.y);
  q.loose = true;
  q.vx = -side * u * rnd(0.5, 1.1);
  q.vy = -u * rnd(0.15, 0.5);
  q.vr = -side * rnd(3, 7);
  q.rot = rnd(-0.2, 0.2);
  spawnChips(pt.x, pt.y, 7, 0.7, WOOD_COLS, 0.008, 0.02);
  spawnDust(pt.x, pt.y, 0.6, 0.7);
  state.flash = Math.min(0.95, state.flash + 0.4);
  cam.trauma = Math.min(1.2, cam.trauma + 0.4);
  cam.punch = Math.min(1.2, cam.punch + 0.5);
  state.hitstop = Math.max(state.hitstop, 0.09);
  state.slow = Math.min(state.slow, 0.4);
  AU.hitMat('snap', 1, clamp((pt.x - W / 2) / (W / 2), -1, 1), true);
  if (!said.strap) { said.strap = true; say('绳子也断了。', 3.4); }
}
/* ---------- 灯罩碎裂 ---------- */
function drawGlassCracks(head, r) {
  if (!lamp.cracks.length) return;
  ctx.save();
  ctx.beginPath(); ctx.arc(head.x, head.y, r * 0.98, 0, TAU); ctx.clip();
  ctx.translate(head.x, head.y);
  ctx.lineCap = 'round';
  for (const pts of lamp.cracks) {
    ctx.beginPath();
    for (let i = 0; i < pts.length; i++) {
      if (i) ctx.lineTo(pts[i][0], pts[i][1]); else ctx.moveTo(pts[i][0], pts[i][1]);
    }
    ctx.strokeStyle = 'rgba(255,252,240,.5)';
    ctx.lineWidth = Math.max(0.8, r * 0.07);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(28,22,34,.45)';
    ctx.lineWidth = Math.max(0.5, r * 0.035);
    ctx.stroke();
  }
  ctx.restore();
}

function drawShatteredHead(head, r, t) {
  const f = lampFlick(t);
  radialEllipse(ctx, head.x, head.y, r * 4.2, r * 4.2,
    [[0, 'rgba(158,186,230,' + (0.06 * f).toFixed(3) + ')'], [1, 'rgba(120,150,200,0)']], 'lighter');
  ctx.fillStyle = '#0a0812';
  ctx.beginPath();
  ctx.arc(head.x, head.y - r * 0.06, r * 0.46, 0, TAU);
  ctx.fill();
  ctx.fillStyle = 'rgba(224,238,252,.42)';
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * TAU + 0.26;
    const tip = r * (0.7 + ((i * 37) % 13) / 30);
    ctx.beginPath();
    ctx.moveTo(head.x + Math.cos(a - 0.19) * r * 0.42, head.y + Math.sin(a - 0.19) * r * 0.42);
    ctx.lineTo(head.x + Math.cos(a) * tip, head.y + Math.sin(a) * tip);
    ctx.lineTo(head.x + Math.cos(a + 0.19) * r * 0.42, head.y + Math.sin(a + 0.19) * r * 0.42);
    ctx.closePath(); ctx.fill();
  }
  ctx.strokeStyle = 'rgba(255,236,208,' + (0.16 + 0.12 * Math.sin(t * 3.1)).toFixed(3) + ')';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(head.x - r * 0.2, head.y);
  ctx.quadraticCurveTo(head.x, head.y + r * 0.4, head.x + r * 0.16, head.y - r * 0.05);
  ctx.stroke();
  ctx.fillStyle = '#0a0812';
  ctx.beginPath();
  ctx.moveTo(head.x - r * 0.62, head.y + r * 0.95);
  ctx.lineTo(head.x + r * 0.62, head.y + r * 0.95);
  ctx.lineTo(head.x + r * 0.34, head.y + r * 1.35);
  ctx.lineTo(head.x - r * 0.34, head.y + r * 1.35);
  ctx.closePath(); ctx.fill();
}

/* ---------- 脚影 / 速度线 / 蓄力 ---------- */
function bootPath(g, s) {
  g.beginPath();
  g.moveTo(s * 0.6, -s * 0.32);
  g.quadraticCurveTo(s * 0.76, s * 0.08, s * 0.44, s * 0.24);
  g.lineTo(-s * 0.46, s * 0.26);
  g.quadraticCurveTo(-s * 0.95, s * 0.2, -s * 0.85, -s * 0.06);
  g.quadraticCurveTo(-s * 0.56, -s * 0.4, -s * 0.08, -s * 0.5);
  g.quadraticCurveTo(s * 0.34, -s * 0.55, s * 0.6, -s * 0.32);
  g.closePath();
}

function drawBoot(x, y, side, s, alpha, full, heavy, tilt) {
  const g = ctx;
  g.save();
  g.globalAlpha = clamp(alpha, 0, 1);
  g.translate(x, y);
  g.scale(side, 1);
  g.rotate(tilt);
  if (full) {
    g.lineCap = 'round';
    const lg = g.createLinearGradient(-s * 0.2, -s * 0.1, -s * 2.3, -s * 1.2);
    lg.addColorStop(0, 'rgba(9,8,15,.95)');
    lg.addColorStop(0.55, 'rgba(9,8,15,.6)');
    lg.addColorStop(1, 'rgba(9,8,15,0)');
    g.strokeStyle = lg;
    g.lineWidth = s * 0.44;
    g.beginPath();
    g.moveTo(-s * 0.2, -s * 0.1);
    g.quadraticCurveTo(-s * 1.25, -s * 0.36, -s * 2.3, -s * 1.2);
    g.stroke();
    const hg = g.createLinearGradient(-s * 0.4, -s * 0.4, -s * 2.0, -s * 1.2);
    hg.addColorStop(0, 'rgba(255,196,140,.1)');
    hg.addColorStop(1, 'rgba(255,196,140,0)');
    g.strokeStyle = hg;
    g.lineWidth = s * 0.07;
    g.beginPath();
    g.moveTo(-s * 0.4, -s * 0.34);
    g.quadraticCurveTo(-s * 1.25, -s * 0.6, -s * 2.0, -s * 1.24);
    g.stroke();
  }
  bootPath(g, s);
  g.fillStyle = '#07060c';
  g.fill();
  if (full) {
    g.strokeStyle = heavy ? 'rgba(255,214,168,.34)' : 'rgba(255,196,140,.2)';
    g.lineWidth = s * 0.09;
    g.beginPath();
    g.moveTo(-s * 0.8, -s * 0.02);
    g.quadraticCurveTo(-s * 0.5, -s * 0.42, s * 0.06, -s * 0.5);
    g.stroke();
    g.strokeStyle = 'rgba(8,6,12,.9)';
    g.lineWidth = s * 0.1;
    g.beginPath();
    g.moveTo(-s * 0.44, s * 0.25);
    g.lineTo(s * 0.42, s * 0.23);
    g.stroke();
  }
  g.restore();
}

function drawKicks() {
  for (const k of kicks) {
    const st = kickState(k);
    if (st.a <= 0.015) continue;
    const gh = k.t < k.hold ? (k.t < 0 ? 3 : 1) : 2;
    for (let gi = gh; gi >= 0; gi--) {
      const off = st.off + gi * k.reach * 0.16;
      const up = st.up * (1 + gi * 0.12);
      drawBoot(k.x - k.side * off, k.y + up, k.side, k.s * (1 - gi * 0.03),
        st.a * (gi === 0 ? 1 : 0.13), gi === 0, k.heavy, k.tilt);
    }
    if (k.t > -0.01 && k.t < k.hold + k.ret * 0.35) {
      const pk = 1 - clamp(Math.abs(k.t) / (k.hold + k.ret * 0.3), 0, 1);
      radialEllipse(ctx, k.x - k.side * k.s * 0.7, k.y + k.s * 0.1,
        k.s * (1.1 + (1 - pk) * 2.2), k.s * (1.1 + (1 - pk) * 2.2),
        [[0, 'rgba(255,232,196,' + (0.4 * pk).toFixed(3) + ')'], [1, 'rgba(255,200,150,0)']], 'lighter');
    }
  }
}

function drawSpeedLines() {
  for (const sl of speedLines) {
    const k = clamp(sl.life / sl.max, 0, 1);
    const grow = 1 - k;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for (const L of sl.lines) {
      const r0 = L[1] * (0.4 + grow * 0.7);
      const r1 = L[1] + L[2] * (0.3 + grow * 1.15);
      ctx.strokeStyle = 'rgba(255,236,206,' + (0.45 * k * k).toFixed(3) + ')';
      ctx.lineWidth = sl.w * (0.35 + k);
      ctx.beginPath();
      ctx.moveTo(sl.x + Math.cos(L[0]) * r0, sl.y + Math.sin(L[0]) * r0);
      ctx.lineTo(sl.x + Math.cos(L[0]) * r1, sl.y + Math.sin(L[0]) * r1);
      ctx.stroke();
    }
    ctx.restore();
  }
}

const chargePt = { x: 0, y: 0, valid: false };
const CHARGE_T = 0.78, CHARGE_MIN = 0.2;

function chargeSide(x) { return x >= W * 0.5 ? 1 : -1; }

function drawCharge() {
  if ((!charging || charge < 0.06) && charge < 0.02) return;
  if (!chargePt.valid) return;
  const u = S.u;
  const side = chargeSide(chargePt.x);
  const pull = u * (0.34 + charge * 0.8);
  const bob = Math.sin(state.time * 21) * u * 0.012 * charge;
  const x = chargePt.x + side * pull, y = chargePt.y - u * 0.04 + bob;
  drawBoot(x, y, side, u * (0.24 + charge * 0.05), 0.4 + charge * 0.5, true, charge > 0.6, -0.45);
  const rr = u * (0.24 - charge * 0.13);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = 'rgba(255,214,160,' + (0.16 + charge * 0.5).toFixed(3) + ')';
  ctx.lineWidth = u * 0.008 * (1 + charge);
  ctx.setLineDash([rr * 0.5, rr * 0.5]);
  ctx.lineDashOffset = -state.time * rr * 1.2;
  ctx.beginPath(); ctx.arc(chargePt.x, chargePt.y, rr, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);
  if (charge > 0.94) {
    const pu = 0.5 + 0.5 * Math.sin(state.time * 14);
    radialEllipse(ctx, chargePt.x, chargePt.y, rr * 2.1, rr * 2.1,
      [[0, 'rgba(255,226,186,' + (0.1 + pu * 0.1).toFixed(3) + ')'], [1, 'rgba(255,200,150,0)']], 'lighter');
  }
  ctx.restore();
}

function updateCharge(rdt) {
  if (!charging) {
    if (charge > 0) charge = Math.max(0, charge - rdt * 5);
    return;
  }
  charge = Math.min(1, charge + rdt / CHARGE_T);
  if (charge > 0.24) AU.chargeStart();
  if (charge >= 1 && Math.random() < rdt * 26) {
    const side = chargeSide(chargePt.x);
    spawnDust(chargePt.x + side * S.u * 0.34, S.groundY, 0.25, 0.4);
  }
}

function beginCharge(wx, wy, fromKey) {
  charging = true;
  chargeFromKey = !!fromKey;
  charge = 0;
  chargePt.x = wx; chargePt.y = wy; chargePt.valid = true;
}

function releaseCharge(wx, wy) {
  if (!charging) return;
  charging = false;
  const b = charge;
  charge = 0;
  AU.chargeEnd(b >= CHARGE_MIN);
  if (b >= CHARGE_MIN) {
    chargeBoost = b;
    onKick(wx, wy, chargeFromKey);
    chargeBoost = 0;
  }
}

window.addEventListener('resize', () => { if (!state.started) buildProps(); });
buildProps();
</script>
</body>
</html>
